<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeoBookmarkManager — Web Mock</title>
  <style>
    body{ background:#121212; color:#eee; font-family: system-ui, "Noto Sans JP", sans-serif; margin:24px }
    .card{ background:#1e1e1e; border-radius:12px; padding:16px; margin-bottom:12px; border:1px solid rgba(255,255,255,.04)}
    .btn{ padding:10px 14px; border-radius:10px; background:#bb86fc; color:#1b1026; display:inline-block; cursor:pointer }
    pre{ white-space:pre-wrap; word-break:break-word }
  </style>
</head>
<body>
  <h2>NeoBookmarkManager — Web UI (Prototype)</h2>
  <div class="card">
    <div style="display:flex; gap:12px; align-items:center;">
      <button id="load" class="btn">Load Bookmarks</button>
      <input id="path" placeholder="Leave empty for sample fixture" style="flex:1; padding:8px; background:#0f0f0f; color:#eee; border-radius:8px; border:1px solid rgba(255,255,255,.04)">
    </div>
  </div>
  <div id="out" class="card">
    <em>Result will appear here</em>
  </div>

  <script>
    async function load(path){
      try{
        const url = '/api/bookmarks' + (path? ('?path='+encodeURIComponent(path)) : '')
        const res = await fetch(url)
        const data = await res.json()
        document.getElementById('out').innerHTML = '<pre>'+JSON.stringify(data, null, 2)+'</pre>'
      }catch(e){
        document.getElementById('out').innerText = 'Failed: '+e
      }
    }
    document.getElementById('load').addEventListener('click', ()=> load(document.getElementById('path').value))
  </script>
</body>
</html>
