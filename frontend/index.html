<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoBookMarkManager</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-view="list" data-dual="false">
  <div id="toast" class="toast hidden"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📚</span>
      <span class="brand-name">NeoBookMarkManager</span>
      <span class="brand-version">v0.1</span>
    </div>
    <div class="topbar-search">
      <span class="topbar-search-icon">⌕</span>
      <input id="searchInput" type="search" placeholder="検索..." autocomplete="off" />
      <button id="searchClearBtn" class="ghost-btn">クリア</button>
    </div>
    <div class="topbar-tools">
      <button id="dualPaneBtn" class="ghost-btn" aria-pressed="false">2画面モード</button>
      <button id="faviconPrivacyBtn" class="ghost-btn" aria-pressed="false" title="ONにするとfaviconをGoogleから取得しません">favicon OFF</button>
      <span class="status-chip" id="statusChip">起動中…</span>
      <span class="view-chip" id="viewChip">表示: List</span>
    </div>
  </header>

  <main class="layout">

    <!-- 左カラム: 上段ツリー + 下段リスト -->
    <div class="col-left">

      <!-- 上段: ツリーA (+ 2画面時にスプリッターとツリーBが隣に並ぶ) -->
      <div class="pane-upper">

        <!-- Tree A -->
        <section class="pane-tree" id="paneTreeA" aria-label="フォルダツリーA">
          <header class="pane-header">
            <h2 class="pane-title" id="treeALabel">Tree</h2>
            <span class="count-badge" id="treeCount">0</span>
            <div class="view-toggle">
              <button class="ghost-btn" id="treeExpandAllBtn">展開</button>
              <button class="ghost-btn" id="treeCollapseAllBtn">縮小</button>
            </div>
          </header>
          <div class="tree-scroll" id="treeContainerA"></div>
        </section>

        <!-- 2画面時のみ表示: スプリッターとツリーB -->
        <div class="splitter-h" id="dualTreeSplitter" data-target="dual-tree"></div>
        <section class="pane-tree" id="paneTreB" aria-label="フォルダツリーB">
          <header class="pane-header">
            <h2 class="pane-title">Tree B</h2>
            <div class="view-toggle">
              <button class="ghost-btn" id="treeBExpandAllBtn">展開</button>
              <button class="ghost-btn" id="treeBCollapseAllBtn">縮小</button>
            </div>
          </header>
          <div class="tree-scroll" id="treeContainerB"></div>
        </section>

      </div><!-- /.pane-upper -->

      <!-- 上下スプリッター -->
      <div class="splitter-v" data-target="upper-lower"></div>

      <!-- 下段: リスト/カード -->
      <section class="pane-list" aria-label="ブックマーク一覧">
        <header class="pane-header">
          <h2 class="pane-title">Workspace</h2>
          <span class="count-badge" id="listCount">0</span>
          <div class="view-toggle">
            <button class="ghost-btn" id="viewListBtn" aria-pressed="true">List</button>
            <button class="ghost-btn" id="viewCardBtn" aria-pressed="false">Card</button>
          </div>
        </header>
        <div class="list-scroll">
          <ul id="listContainer"></ul>
        </div>
      </section>

    </div><!-- /.col-left -->

    <!-- 左右スプリッター -->
    <div class="splitter-h" data-target="main-cols"></div>

    <!-- 右: アクションパネル -->
    <aside class="pane-actions" aria-label="操作パネル">
      <section class="action-group" data-group="file">
        <h3 class="action-group-title">File</h3>
        <div class="action-grid">
          <button class="primary-btn" data-cmd="file.open">開く</button>
          <button class="primary-btn" data-cmd="file.save">保存</button>
          <button class="primary-btn" data-cmd="file.save-as">名前を付けて保存</button>
          <button class="tonal-btn" data-cmd="backup.restore">バックアップから復元</button>
          <button class="tonal-btn" data-cmd="backup.undo-latest">直前バックアップに戻す</button>
        </div>
      </section>

      <section class="action-group" data-group="edit">
        <h3 class="action-group-title">Edit</h3>
        <div class="action-grid">
          <button class="primary-btn" data-cmd="edit.new-folder">新規フォルダ</button>
          <button class="primary-btn" data-cmd="edit.new-bookmark">新規ブックマーク</button>
          <button class="tonal-btn" data-cmd="edit.move-up">上へ移動</button>
          <button class="danger-btn" data-cmd="edit.delete">削除</button>
          <button class="ghost-btn" data-cmd="edit.undo" id="btnUndo" title="Ctrl+Z">↩ Undo</button>
          <button class="ghost-btn" data-cmd="edit.redo" id="btnRedo" title="Ctrl+Y">↪ Redo</button>
        </div>
      </section>

      <section class="action-group" data-group="organize">
        <h3 class="action-group-title">Organize <span class="action-group-scope" id="organizeScope">（全体）</span></h3>
        <div class="action-grid">
          <button class="tonal-btn" data-cmd="organize.dedupe">重複削除</button>
          <button class="tonal-btn" data-cmd="organize.merge-dup-folders">重複フォルダ統合</button>
          <button class="tonal-btn" data-cmd="organize.sort-by-domain">ドメイン順ソート</button>
          <button class="tonal-btn" data-cmd="organize.consolidate-domain">ドメイン統合</button>
          <button class="tonal-btn" data-cmd="organize.domain-keyword">ドメイン×キーワード</button>
        </div>
      </section>

      <section class="action-group" data-group="enrich">
        <h3 class="action-group-title">Enrich <span class="action-group-scope" id="enrichScope">（全体）</span></h3>
        <div class="action-grid">
          <button class="tonal-btn" data-cmd="network.fix-titles">URLからタイトル更新</button>
          <button class="tonal-btn" data-cmd="network.fetch-preview">説明文を取得</button>
          <button class="tonal-btn" data-cmd="autotag.offline">自動タグ付け</button>
          <button class="tonal-btn" data-cmd="network.link-check">リンク切れチェック</button>
          <button class="ghost-btn" data-cmd="network.proxy-check">Proxy確認</button>
        </div>
      </section>

      <section class="action-group" data-group="ai">
        <h3 class="action-group-title">AI</h3>
        <div class="action-grid">
          <button class="primary-btn" data-cmd="classify.ai">AI 分類</button>
          <button class="ghost-btn" data-cmd="ai.settings">⚙ AI 設定</button>
        </div>
      </section>

      <section class="detail-panel" id="detailPanel">
        <h3 class="action-group-title">Detail</h3>
        <div id="detailEmpty" class="detail-empty">ブックマークを選択してください。</div>
        <div id="detailCard" class="detail-card hidden">
          <input id="detailTitle" class="detail-field detail-title-input" placeholder="タイトル" />
          <div id="detailFetchedTitle" class="detail-fetched-title hidden"></div>
          <input id="detailUrl" class="detail-field detail-url-input" placeholder="URL" spellcheck="false" />
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-section">
            <div class="detail-section-label">タグ</div>
            <div class="detail-tags" id="detailTags">(なし)</div>
          </div>
          <div class="detail-section">
            <div class="detail-section-label">説明</div>
            <textarea id="detailDescription" class="detail-field detail-desc-input" placeholder="説明" rows="3"></textarea>
          </div>
          <div class="detail-actions">
            <button class="ghost-btn" data-cmd="detail.edit-tags">タグ編集</button>
            <button class="ghost-btn" data-cmd="detail.copy-url">URLコピー</button>
            <button class="ghost-btn" data-cmd="detail.move">移動</button>
            <button class="danger-btn" data-cmd="detail.delete">削除</button>
          </div>
        </div>
      </section>
    </aside>

  </main>

  <template id="treeNodeTemplate">
    <li class="tree-node">
      <div class="tree-row" tabindex="0">
        <span class="tree-toggle" aria-hidden="true"></span>
        <span class="tree-folder-icon" aria-hidden="true">📁</span>
        <span class="tree-label"></span>
        <span class="tree-count"></span>
      </div>
      <ul class="tree-children hidden"></ul>
    </li>
  </template>

  <template id="treeBmTemplate">
    <li class="tree-bm" tabindex="0" draggable="true">
      <img class="tree-bm-fav" alt="" />
      <span class="tree-bm-label"></span>
    </li>
  </template>

  <template id="listRowTemplate">
    <li class="bm-row" tabindex="0">
      <img class="bm-favicon" alt="" />
      <div class="bm-text">
        <div class="bm-title"></div>
        <div class="bm-url"></div>
      </div>
    </li>
  </template>

  <template id="listCardTemplate">
    <li class="bm-card" tabindex="0">
      <img class="bm-card-favicon" alt="" />
      <div class="bm-card-title"></div>
      <div class="bm-card-url"></div>
    </li>
  </template>

  <script src="./app.js"></script>
</body>
</html>
