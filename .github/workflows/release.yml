name: Release

# バージョンタグを push すると、ポータブルEXEをビルドして
# GitHub Release に添付します。
#
# ※このワークフローはまだ一度も実行されていません。最初のタグで失敗した場合は
#   RELEASING.md の手順どおり手元でビルドしてください。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --package nbm-core --package nbm-server

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # タグ名とビルドされるバージョンがずれたまま公開されないようにする。
      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $cfg = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -and $tag -ne $cfg) {
            throw "tag v$tag does not match tauri.conf.json version $cfg"
          }

      - name: Build
        run: cargo tauri build --no-bundle

      - name: SHA256
        shell: pwsh
        run: |
          $h = Get-FileHash target/release/NeoBookMarkManager.exe -Algorithm SHA256
          "$($h.Hash)  NeoBookMarkManager.exe" | Out-File -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: CHANGELOG.md
          files: |
            target/release/NeoBookMarkManager.exe
            SHA256SUMS.txt
