[workspace]
resolver = "2"
members = [
    "crates/nbm-core",
    "crates/nbm-server",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "ブックマークHTMLを整理・タグ付け・AI分類するデスクトップアプリ"
authors = ["kisknsmr"]
license-file = "LICENSE"
repository = "https://github.com/kisknsmr/NeoBookMarkManager"
readme = "README.md"
# 配布はビルド済みEXE。crates.io には公開しない。
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
camino = "1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
markup5ever = "0.12"
configparser = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
once_cell = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio-stream = "0.1"
futures-util = "0.3"
