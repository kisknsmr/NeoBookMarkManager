[package]
name = "nbm-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "NeoBookMarkManager Tauri shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nbm-core = { path = "../crates/nbm-core" }
nbm-server = { path = "../crates/nbm-server" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
camino.workspace = true
# `devtools` keeps the inspector available in release builds too, so a
# failure that only reproduces in the packaged exe can still be read off the
# console instead of guessed at.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2.7.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
# The distributable is a single portable exe, so the binary carries the product
# name directly instead of the crate name.
name = "NeoBookMarkManager"
path = "src/main.rs"
